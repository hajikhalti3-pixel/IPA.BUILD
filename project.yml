name: NumberKeys
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NumberKeys:
    type: application
    platform: iOS
    sources:
      - path: NumberKeys
        excludes:
          - "*.entitlements"
    dependencies:
      - target: NumberKeysKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NumberKeys
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NumberKeys
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: NumberKeys/NumberKeys.entitlements

  NumberKeysKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: NumberKeysKeyboard
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: NumberKeys/SharedSettings.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NumberKeys.Keyboard
        INFOPLIST_FILE: NumberKeysKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: NumberKeysKeyboard/NumberKeysKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
