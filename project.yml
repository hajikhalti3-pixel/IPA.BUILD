name: NumberKeys
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic

targets:
  NumberKeys:
    type: application
    platform: iOS
    sources:
      - path: NumberKeys
    dependencies:
      - target: NumberKeysKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NumberKeys
        INFOPLIST_KEY_CFBundleDisplayName: NumberKeys
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: NumberKeys/NumberKeys.entitlements

  NumberKeysKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: NumberKeysKeyboard
      - path: NumberKeys/SharedSettings.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NumberKeys.Keyboard
        INFOPLIST_FILE: NumberKeysKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: NumberKeysKeyboard/NumberKeysKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
